; PlatformIO build, dependency, upload, and Ethernet pin-profile configuration.
; Build:  pio run
; Flash:  pio run -t upload            (auto-detect LAN 13.2 or LAN / PoE Base)
;         pio run -e core2-lan-13_2 -t upload   (LAN Module 13.2)

[platformio]
default_envs = core2-lan-auto
; Keep build output and downloaded libraries out of the synced Google Drive folder
build_dir   = ${sysenv.HOME}/.cache/pio-build/net-tool/build
libdeps_dir = ${sysenv.HOME}/.cache/pio-build/net-tool/libdeps

[env]
platform = espressif32@^6.9.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.filesystem = littlefs
lib_deps =
    m5stack/M5Unified@^0.2.2
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DETH_PIN_SCK=18
    -DETH_PIN_MISO=38
    -DETH_PIN_MOSI=23

; One firmware for either supported Core2 pin mapping. GPIO0 must remain free
; for the LAN 13.2 reset line while probing, so audio stays disabled.
[env:core2-lan-auto]
build_flags =
    ${env.build_flags}
    -DETH_AUTO_DETECT
    -DNO_SOUND

; M5Stack LAN Base / LAN PoE Base (W5500) stacked under a Core2
[env:core2-lan-base]
build_flags =
    ${env.build_flags}
    -DETH_PIN_CS=26
    -DETH_PIN_RST=19
    -DETH_PIN_INT=34

; M5Stack LAN Module 13.2 (W5500) with its jumpers in the factory position.
; Its reset line lands on GPIO0, which the Core2 speaker also uses, so this
; profile disables the speaker and gives GPIO0 to the Ethernet reset line.
[env:core2-lan-13_2]
build_flags =
    ${env.build_flags}
    -DETH_PIN_CS=33
    -DETH_PIN_RST=0
    -DETH_PIN_INT=35
    -DNO_SOUND

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 320 240">
<title>Core2 diagnostic tools menu concept</title>
<desc>Illustrative eight-tile tools menu for gateway ping, internet ping, traceroute, DNS and web checks, DHCP scan, port blinking, QR handoff, and extra tools.</desc>
<rect width="320" height="240" fill="#080e1c"/>
<style>text{font-family:Arial,Helvetica,sans-serif;font-weight:700}</style>
<rect x="0" y="0" width="320" height="28" fill="#22c55e"/><circle cx="14" cy="14" r="6" fill="#000"/><circle cx="14" cy="14" r="4" fill="#f5f8ff"/><text x="28" y="18" font-size="10" fill="#000">LINK 100M FULL</text><text x="312" y="18" font-size="10" text-anchor="end" fill="#000">84%</text>
<!-- eight icon-only touch targets -->
<g fill="#18243e" stroke-width="1.2">
<rect x="6" y="34" width="152" height="35" rx="7" stroke="#22c55e"/><rect x="162" y="34" width="152" height="35" rx="7" stroke="#3b82f6"/>
<rect x="6" y="73" width="152" height="35" rx="7" stroke="#a855f7"/><rect x="162" y="73" width="152" height="35" rx="7" stroke="#14b8a6"/>
<rect x="6" y="112" width="152" height="35" rx="7" stroke="#f97316"/><rect x="162" y="112" width="152" height="35" rx="7" stroke="#ec4899"/>
<rect x="6" y="151" width="152" height="35" rx="7" stroke="#22d3ee"/><rect x="162" y="151" width="152" height="35" rx="7" stroke="#facc15"/>
</g>
<!-- gateway/router -->
<g stroke="#22c55e" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="68" y="46" width="24" height="15" rx="3"/><path d="M74 46l-3-7m15 7l3-7"/><circle cx="74" cy="54" r="1" fill="#22c55e"/><circle cx="80" cy="54" r="1" fill="#22c55e"/><circle cx="86" cy="54" r="1" fill="#22c55e"/></g>
<!-- globe -->
<g stroke="#3b82f6" fill="none" stroke-width="1.5"><circle cx="238" cy="51.5" r="12"/><ellipse cx="238" cy="51.5" rx="5" ry="12"/><ellipse cx="238" cy="51.5" rx="12" ry="5"/></g>
<!-- route hops -->
<g stroke="#a855f7" fill="#a855f7" stroke-width="1.5" stroke-linecap="round"><path d="M62 96l9-13 7 11 8-12" fill="none"/><circle cx="62" cy="96" r="2.5"/><circle cx="71" cy="83" r="2.5"/><circle cx="78" cy="94" r="2.5"/><circle cx="86" cy="82" r="2.5"/></g>
<!-- browser and DNS globe -->
<g stroke="#14b8a6" fill="none" stroke-width="1.3"><rect x="224" y="79" width="28" height="21" rx="3"/><path d="M225 85h26"/><circle cx="228" cy="82" r="1" fill="#14b8a6"/><circle cx="232" cy="82" r="1" fill="#14b8a6"/><circle cx="239" cy="92" r="6"/><ellipse cx="239" cy="92" rx="2" ry="6"/><ellipse cx="239" cy="92" rx="6" ry="2"/></g>
<!-- DHCP servers -->
<g stroke="#f97316" fill="none" stroke-width="1.4"><rect x="62" y="117" width="26" height="10" rx="2"/><rect x="62" y="129" width="26" height="10" rx="2"/><circle cx="67" cy="122" r="1" fill="#f97316"/><circle cx="67" cy="134" r="1" fill="#f97316"/><path d="M72 122h12m-12 12h12"/></g>
<!-- switch ports / activity -->
<g stroke="#ec4899" fill="none" stroke-width="1.3"><rect x="224" y="120" width="28" height="17" rx="3"/><rect x="228" y="125" width="4" height="6"/><rect x="234" y="125" width="4" height="6"/><rect x="240" y="125" width="4" height="6"/><rect x="246" y="125" width="4" height="6"/><path d="M247 117l3-4m1 7h5"/></g>
<!-- QR code -->
<g stroke="#22d3ee" fill="none" stroke-width="1.2"><rect x="63" y="157" width="11" height="11"/><rect x="66" y="160" width="5" height="5" fill="#22d3ee"/><rect x="77" y="157" width="11" height="11"/><rect x="80" y="160" width="5" height="5" fill="#22d3ee"/><rect x="63" y="171" width="11" height="11"/><rect x="66" y="174" width="5" height="5" fill="#22d3ee"/><path d="M78 172h3v3h-3zm6 0h3v3h-3zm-6 6h3v3h-3zm6 0h3v3h-3z" fill="#22d3ee"/></g>
<!-- extra tools: app tiles and plus -->
<g stroke="#facc15" fill="none" stroke-width="1.3" stroke-linecap="round"><rect x="226" y="156" width="10" height="10" rx="2"/><rect x="240" y="156" width="10" height="10" rx="2"/><rect x="226" y="170" width="10" height="10" rx="2"/><path d="M245 170v10m-5-5h10"/></g>
<!-- Network, Switch, and Tools navigation tabs -->
<g font-size="10" text-anchor="middle"><rect x="3" y="198" width="102" height="40" rx="8" fill="#18243e" stroke="#22d3ee"/><text x="54" y="221" fill="#22d3ee">NETWORK</text><rect x="109" y="198" width="102" height="40" rx="8" fill="#18243e" stroke="#facc15"/><text x="160" y="221" fill="#facc15">SWITCH</text><rect x="215" y="198" width="102" height="40" rx="8" fill="#f97316" stroke="#f97316"/><text x="266" y="221" fill="#000">TOOLS</text></g>
</svg>
